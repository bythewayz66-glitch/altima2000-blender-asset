name: Attach release assets

# Attaches the large binary deliverables (.blend / .glb / .fbx) to the v1.0.0
# GitHub Release.  Runs on GitHub's own runners, which have the repo token and
# can pull the Git LFS objects, so the release assets are produced from the
# exact committed binaries.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Attach binaries to the v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v1.0.0
          FILES="altima2000_assembly.blend altima2000_assembly_linked.blend altima2000_exploded.blend altima2000_module_engine.blend altima2000_module_drivetrain.blend altima2000_module_suspension.blend altima2000_module_wheels.blend altima2000_module_brakes.blend altima2000_module_exhaust.blend altima2000_module_doors.blend altima2000.glb altima2000.fbx"
          for f in $FILES; do
            test -s "$f" || { echo "MISSING or EMPTY: $f"; exit 1; }
          done
          gh release upload "$TAG" $FILES --clobber
          echo "=== release assets now attached ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
